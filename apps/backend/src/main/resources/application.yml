spring:
  application:
    name: contaforte-backend
  datasource:
    # Em produção vêm do ambiente (SPRING_DATASOURCE_URL/USERNAME/PASSWORD), nunca daqui.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/contaforte}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          batch_size: 100        # importações gravam até 20 mil linhas: inserção em lote
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      password: ${SPRING_DATA_REDIS_PASSWORD:}
  mvc:
    problemdetails:
      enabled: true       # erros em application/problem+json (RFC 7807)
  servlet:
    multipart:
      max-file-size: 5MB          # igual a ImportLimits.MAX_BYTES
      max-request-size: 5632KB    # arquivo + campos do formulário

server:
  tomcat:
    max-swallow-size: 10MB        # upload acima do limite recebe 413 em vez de a conexão ser derrubada
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native   # IP real do cliente vindo do gateway (rede interna confiável)

contaforte:
  jwt:
    private-key-b64: ${JWT_PRIVATE_KEY_B64:}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    enabled: false

management:
  server:
    port: 8081            # porta de gestão: acessível só na rede interna, nunca pelo gateway
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true   # buckets para o p95 no Grafana

logging:
  structured:
    format:
      console: ecs        # logs em JSON (timestamp, level, service, traceId...)
    ecs:
      service:
        name: ${spring.application.name}
