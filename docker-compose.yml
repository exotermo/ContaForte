# ContaForte — stack base (Milestone 1, Etapa 1)
# Redes:
#   edge: bridge, única com publicação de porta (apenas o gateway, em 127.0.0.1)
#   app : internal, sem saída para a Internet (dados e serviços)
#   obs : internal, observabilidade (serviços entram na Etapa 6)

name: contaforte

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
    internal: true
  obs:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
  mqtt-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [app]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina com ./cf init}
      POSTGRES_USER: ${POSTGRES_USER:?defina com ./cf init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina com ./cf init}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [app]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?defina com ./cf init}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDISCLI_AUTH\" --appendonly yes --save 60 1000"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 256m

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    networks: [app]
    environment:
      MQTT_USER: ${MQTT_USER:?defina com ./cf init}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?defina com ./cf init}
    volumes:
      - ./infrastructure/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infrastructure/mqtt/entrypoint.sh:/entrypoint.sh:ro
      - mqtt-data:/mosquitto/data
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u \"$$MQTT_USER\" -P \"$$MQTT_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: 128m

  backend:
    build: ./apps/backend
    restart: unless-stopped
    networks: [app]            # sem saída à Internet; o gateway o alcança pela rede app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64:?defina com ./cf init}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?defina com ./cf init}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina com ./cf init}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    mem_limit: 768m

  web:
    build: ./apps/web
    restart: unless-stopped
    networks: [app]            # só o gateway o alcança; fala com o backend pela rede interna
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/up"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    mem_limit: 256m

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [edge, app]
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./infrastructure/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 64m
