# ContaForte — stack base (Milestone 1, Etapa 1)
# Redes:
#   edge: bridge, única com publicação de porta (apenas o gateway, em 127.0.0.1)
#   app : internal, sem saída para a Internet (dados e serviços)
#   obs : internal, observabilidade (Prometheus, Grafana, Loki, Alloy, exporters)

name: contaforte

# Perfis (COMPOSE_PROFILES no .env, ou ./cf obs up): sem nenhum, sobe só o núcleo.
#   obs    : monitoramento (Prometheus, Loki, Alloy, Grafana, exporters)
#   iot    : broker MQTT (ainda sem uso pela aplicação)
#   tunnel : Cloudflare Tunnel
# As três imagens daqui nunca são baixadas (pull_policy: never): são construídas no repositório ou carregadas do
# pacote de instalação (./cf release), que define CONTAFORTE_VERSION.
# O Docker não limita o tamanho dos logs por padrão: sem rotação eles enchem o disco com o tempo.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  edge:
    driver: bridge
  app:
    driver: bridge
    internal: true
  obs:
    driver: bridge
    internal: true

volumes:
  postgres-data:
  redis-data:
  mqtt-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:

services:
  postgres:
    logging: *logging
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [app]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina com ./cf init}
      POSTGRES_USER: ${POSTGRES_USER:?defina com ./cf init}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina com ./cf init}
    # Dimensionado para uso pessoal em 192 MiB (ADR-021): o backend usa no máximo 5 conexões; sem consultas paralelas
    # nem JIT, que gastam memória e quase não ajudam em 2 núcleos com este volume de dados.
    command:
      - postgres
      - -c
      - shared_buffers=48MB
      - -c
      - max_connections=20
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=32MB
      - -c
      - effective_cache_size=128MB
      - -c
      - max_parallel_workers_per_gather=0
      - -c
      - max_parallel_maintenance_workers=0
      - -c
      - jit=off
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 192m

  redis:
    logging: *logging
    image: redis:7-alpine
    restart: unless-stopped
    networks: [app]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?defina com ./cf init}
    # Guarda só os contadores dos limitadores (login, importação). Cheio, recusa gravações em vez de despejar chaves:
    # despejar zeraria contadores, e sem eles o login falha fechado.
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDISCLI_AUTH\" --appendonly yes --save 60 1000 --maxmemory 16mb --maxmemory-policy noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 32m

  mqtt:
    profiles: [iot]
    logging: *logging
    image: eclipse-mosquitto:2
    restart: unless-stopped
    networks: [app]
    environment:
      MQTT_USER: ${MQTT_USER:?defina com ./cf init}
      MQTT_PASSWORD: ${MQTT_PASSWORD:?defina com ./cf init}
    volumes:
      - ./infrastructure/mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infrastructure/mqtt/entrypoint.sh:/entrypoint.sh:ro
      - mqtt-data:/mosquitto/data
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -h localhost -u \"$$MQTT_USER\" -P \"$$MQTT_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3 >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: 128m

  backend:
    logging: *logging
    build: ./apps/backend
    image: contaforte-backend:${CONTAFORTE_VERSION:-dev}
    pull_policy: never
    restart: unless-stopped
    networks: [app, obs]       # sem saída à Internet; obs = o Prometheus coleta a porta de gestão (8081)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_PRIVATE_KEY_B64: ${JWT_PRIVATE_KEY_B64:?defina com ./cf init}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?defina com ./cf init}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina com ./cf init}
      # Memória da JVM dentro dos 448 MiB do contêiner (ADR-021). Além do heap há ~125 MB de classes, o código
      # compilado, as pilhas das threads e memória nativa. Só o primeiro nível do JIT: bem menos memória e subida
      # mais rápida. A última opção impede que cada thread guarde um buffer do tamanho do maior arquivo que já leu.
      # Mudou um número aqui: rode ./cf bench.
      JAVA_TOOL_OPTIONS: >-
        -XX:+UseSerialGC -Xms32m -Xmx224m -Xss512k -XX:MinHeapFreeRatio=15 -XX:MaxHeapFreeRatio=35
        -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=48m -XX:MaxMetaspaceSize=176m
        -XX:+ExitOnOutOfMemoryError -Djdk.nio.maxCachedBufferSize=262144
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s       # processador antigo demora a subir; falhas neste período não contam
    mem_limit: 448m

  web:
    logging: *logging
    build: ./apps/web
    image: contaforte-web:${CONTAFORTE_VERSION:-dev}
    pull_policy: never
    restart: unless-stopped
    networks: [app]            # só o gateway o alcança; fala com o backend pela rede interna
    depends_on:
      backend:
        condition: service_healthy
    environment:
      BACKEND_URL: http://backend:8080
      NODE_OPTIONS: --max-old-space-size=80   # teto do heap do Node, abaixo do limite do contêiner
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/up"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 60s
    mem_limit: 160m

  # ---------------------------------------------------------------- observabilidade
  # Proxy somente-leitura da API do Docker: o Alloy e o container-exporter nunca montam o docker.sock diretamente.
  docker-proxy:
    profiles: [obs]
    logging: *logging
    image: tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    networks: [obs]
    environment:
      CONTAINERS: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1      # o Alloy consulta redes ao descobrir containers
      EVENTS: 1
      VERSION: 1
      POST: 0          # nenhuma operação de escrita
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    mem_limit: 64m

  prometheus:
    profiles: [obs]
    logging: *logging
    image: prom/prometheus:v3.16.0
    restart: unless-stopped
    networks: [obs]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./infrastructure/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/monitoring/prometheus/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9090/-/ready"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
    mem_limit: 384m

  loki:
    profiles: [obs]
    logging: *logging
    image: grafana/loki:3.6.22
    restart: unless-stopped
    networks: [obs]
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./infrastructure/monitoring/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    # imagem mínima (sem shell/wget): não há healthcheck; o ./cf doctor confere o alvo "loki" no Prometheus
    mem_limit: 384m

  alloy:
    profiles: [obs]
    logging: *logging
    image: grafana/alloy:v1.22.0
    restart: unless-stopped
    networks: [obs]
    depends_on: [loki, docker-proxy]
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./infrastructure/monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    mem_limit: 320m

  # Métricas por container (CPU, memória, rede) lidas pelo proxy somente-leitura. Substitui o cAdvisor,
  # que exigiria o docker.sock e o containerd montados (acesso root implícito ao host).
  container-exporter:
    profiles: [obs]
    logging: *logging
    build: ./tools/container-exporter
    image: contaforte-container-exporter:${CONTAFORTE_VERSION:-dev}
    pull_policy: never
    restart: unless-stopped
    networks: [obs]
    depends_on: [docker-proxy]
    environment:
      DOCKER_HOST_URL: http://docker-proxy:2375
      COMPOSE_PROJECT: contaforte
    mem_limit: 32m

  postgres-exporter:
    profiles: [obs]
    logging: *logging
    image: quay.io/prometheuscommunity/postgres-exporter:v0.21.1
    restart: unless-stopped
    networks: [app, obs]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATA_SOURCE_URI: postgres:5432/${POSTGRES_DB}?sslmode=disable
      DATA_SOURCE_USER: ${POSTGRES_USER}
      DATA_SOURCE_PASS: ${POSTGRES_PASSWORD}
    mem_limit: 64m

  redis-exporter:
    profiles: [obs]
    logging: *logging
    image: oliver006/redis_exporter:v1.98.0
    restart: unless-stopped
    networks: [app, obs]
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 64m

  grafana:
    profiles: [obs]
    logging: *logging
    image: grafana/grafana:13.3.1
    restart: unless-stopped
    networks: [obs]
    depends_on: [prometheus, loki]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:?defina com ./cf init}
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SAMESITE: strict
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/grafana/api/health"]
      interval: 15s
      timeout: 3s
      retries: 10
      start_period: 30s
    mem_limit: 384m

  gateway:
    logging: *logging
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [edge, app, obs]  # obs: para publicar o Grafana em /grafana/
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
    volumes:
      - ./infrastructure/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/gateway/app-locations.inc:/etc/nginx/app-locations.inc:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    mem_limit: 48m             # o processo usa menos de 10; o resto são os buffers de rede durante uploads em paralelo

  # ---------------------------------------------------------------- exposição pública (opcional)
  # Só sobe com COMPOSE_PROFILES=tunnel no .env (ver docs 06_Operacao). Sem portas publicadas: a conexão é de saída.
  # No painel do Cloudflare Zero Trust, o "Public hostname" deve apontar para http://gateway:8081
  cloudflared:
    logging: *logging
    image: cloudflare/cloudflared:2026.3.0
    profiles: [tunnel]
    restart: unless-stopped
    networks: [edge]           # única rede com saída à Internet; não enxerga backend, bancos nem observabilidade
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}   # obrigatório com o perfil tunnel (o cf doctor confere)
      GOMEMLIMIT: 48MiB                 # o coletor de lixo do Go trabalha antes de o contêiner chegar ao limite
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20241", "ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    mem_limit: 64m
