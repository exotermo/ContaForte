name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (cf e container-exporter)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [tools/cf, tools/container-exporter]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...

  backend:
    name: Backend (Java 21 + Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-daemon --console=plain

  web:
    name: Frontend (lint, tipos, testes, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  stack:
    name: Stack (compose, imagens e smoke test)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: tools/cf/go.mod
          cache-dependency-path: tools/cf/go.mod
      - name: cf init (gera .env e segredos aleatórios)
        run: ./cf init
      - name: Compose válido (só o núcleo e com todos os perfis)
        run: |
          docker compose config -q
          TUNNEL_TOKEN=ci docker compose --profile '*' config -q
      - name: Sobe só o núcleo
        run: ./cf up
      - name: Sem perfil, só o núcleo fica de pé
        run: |
          set -euo pipefail
          test "$(docker compose ps -a --format '{{.Service}}' | sort | paste -sd' ')" = "backend gateway postgres redis web"
      - name: Dados de demonstração (o cf seed confere o resumo contra o esperado pelo gerador)
        run: ./cf seed
      - name: Smoke test (gateway e login; sem monitoramento o Grafana fica indisponível)
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          curl -fsS http://127.0.0.1:8080/healthz
          token=$(curl -fsS -H 'Content-Type: application/json' \
            -d "{\"email\":\"$ADMIN_EMAIL\",\"password\":\"$ADMIN_PASSWORD\"}" \
            http://127.0.0.1:8080/api/v1/auth/login | jq -er .accessToken)
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:8080/api/v1/users/me | jq -e .email
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/grafana/api/dashboards/home)" = 503
          ./cf doctor
      - name: Liga o monitoramento e o MQTT
        run: |
          ./cf obs up
          docker compose --profile iot up -d --wait mqtt
      - name: Diagnóstico com o monitoramento (alvos e logs levam alguns segundos) e Grafana protegido
        run: |
          set -euo pipefail
          for i in $(seq 1 12); do ./cf doctor > doctor.log && break; sleep 10; done
          ./cf doctor
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/grafana/api/dashboards/home)" = 401
      # A primeira subida não pega defeitos que só aparecem com arquivos da execução anterior (foi o caso do MQTT).
      - name: Reinicia tudo e exige a stack saudável de novo
        env:
          COMPOSE_PROFILES: obs,iot
        run: |
          set -euo pipefail
          docker compose restart
          docker compose up -d --wait
          sleep 20
          docker compose ps --format '{{.Service}}' | while read -r svc; do
            id=$(docker compose ps -q "$svc")
            test "$(docker inspect --format '{{.State.Status}} {{.RestartCount}}' "$id")" = "running 0" \
              || { echo "$svc instável depois do reinício"; exit 1; }
          done
      - name: cf down derruba também os serviços dos perfis
        run: |
          set -euo pipefail
          ./cf down
          test -z "$(docker ps -a -q --filter label=com.docker.compose.project=contaforte)"
      # O caminho do deploy (ADR-022): o pacote precisa bastar. As imagens são apagadas antes, e nada pode ser construído.
      - name: Pacote de release instala e sobe sem construir
        run: |
          set -euo pipefail
          docker compose --profile '*' down -v
          ./cf release --out /tmp/pacote
          ver=$(git describe --tags --always)
          docker image rm "contaforte-backend:$ver" "contaforte-web:$ver" "contaforte-container-exporter:$ver"
          (cd /tmp/pacote && sha256sum -c SHA256SUMS)
          gunzip -c "/tmp/pacote/contaforte-$ver-images.tar.gz" | docker load
          mkdir /tmp/destino
          tar -xzf "/tmp/pacote/contaforte-$ver.tar.gz" -C /tmp/destino
          cd /tmp/destino
          ./cf init
          ./cf check-images
          ./cf up 2>&1 | tee up.log
          if grep -qiE 'building|load build definition| Built' up.log; then echo "o destino construiu uma imagem"; exit 1; fi
          docker compose ps --format '{{.Image}}' | grep -qx "contaforte-backend:dev" && { echo "imagem de desenvolvimento no pacote"; exit 1; }
          ./cf seed
          ./cf obs up
          ./cf down
      - name: Diagnóstico em caso de falha
        if: failure()
        run: |
          docker compose --profile '*' ps -a
          docker compose --profile '*' logs --tail=80

  generated:
    name: Arquivos gerados em dia (cenário, fixtures e dashboards)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenera e exige que nada mude
        run: |
          python3 tools/gen-synthetic/gen_synthetic.py
          python3 tools/gen-synthetic/gen_import_fixtures.py
          python3 tools/gen-synthetic/gen_classification.py
          python3 tools/gen-dashboards/gen_dashboards.py
          git diff --exit-code -- datasets/synthetic infrastructure/monitoring/grafana/dashboards

  secrets:
    name: Varredura de segredos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (histórico completo)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.24.3 \
            detect --source /repo --config /repo/.gitleaks.toml --redact --verbose --no-banner
