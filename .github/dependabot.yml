# Dependabot: PRs de atualização. Regras gerais:
#  - versões MAJOR (saltos que costumam quebrar) não são abertas sozinhas: atualizamos de propósito, em etapa própria;
#  - minor/patch vêm agrupados em um único PR por ecossistema;
#  - no máximo 3 PRs abertos por ecossistema.
# Atualizações de segurança continuam chegando normalmente (são tratadas à parte).
version: 2

updates:
  # Ações do GitHub: majors liberados (mudanças pequenas e o CI valida)
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /apps/backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /apps/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /apps/web
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: gradle
    directory: /apps/backend
    schedule: { interval: weekly }
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      gradle-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directory: /tools/cf
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: gomod
    directory: /tools/container-exporter
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      go-minor-patch:
        update-types: ["minor", "patch"]
