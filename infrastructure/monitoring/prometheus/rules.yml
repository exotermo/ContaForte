# Regras de alerta. Sem Alertmanager por enquanto: o estado aparece no Prometheus e no Grafana.
groups:
  - name: contaforte
    rules:
      - alert: AlvoForaDoAr
        expr: up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} está fora do ar"

      - alert: BackendErros5xx
        expr: sum(rate(http_server_requests_seconds_count{job="backend",status=~"5.."}[5m])) > 0.1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "Backend retornando 5xx de forma sustentada"

      - alert: PostgresIndisponivel
        expr: pg_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "O exporter não consegue falar com o Postgres"

      - alert: RedisIndisponivel
        expr: redis_up == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "O exporter não consegue falar com o Redis"

      - alert: ContainerPertoDoLimiteDeMemoria
        expr: |
          container_memory_working_set_bytes{name=~"contaforte-.*"}
            / (container_spec_memory_limit_bytes{name=~"contaforte-.*"} > 0) > 0.9
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.name }} usa mais de 90% do limite de memória"
