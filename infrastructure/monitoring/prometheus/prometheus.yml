global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs: [{ targets: ["localhost:9090"] }]

  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs: [{ targets: ["backend:8081"] }]   # porta de gestão: só rede interna

  - job_name: postgres
    static_configs: [{ targets: ["postgres-exporter:9187"] }]

  - job_name: redis
    static_configs: [{ targets: ["redis-exporter:9121"] }]

  - job_name: container-exporter
    static_configs: [{ targets: ["container-exporter:9338"] }]

  - job_name: loki
    static_configs: [{ targets: ["loki:3100"] }]

  - job_name: alloy
    static_configs: [{ targets: ["alloy:12345"] }]

  - job_name: grafana
    metrics_path: /grafana/metrics
    static_configs: [{ targets: ["grafana:3000"] }]
