worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  # upgrade de WebSocket (Grafana Live)
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  resolver 127.0.0.11 valid=10s ipv6=off;  # DNS interno do Docker (resolve upstreams sob demanda)

  # ---- Listener LOCAL (porta 80): o único publicado no host, em 127.0.0.1. Não confia em cabeçalhos do cliente.
  server {
    listen 80;
    set $cf_client_ip $remote_addr;
    set $cf_proto $scheme;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Grafana (rede obs). Só neste listener: nunca é exposto pelo túnel. Login obrigatório (admin + GRAFANA_PASSWORD).
    location = /grafana { return 301 /grafana/; }
    location /grafana/ {
      set $grafana http://grafana:3000;
      proxy_pass $grafana;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      error_page 502 503 504 = @unavailable;
    }

    include /etc/nginx/app-locations.inc;
  }

  # ---- Listener do TÚNEL (porta 8081, nunca publicada no host): usado só pelo cloudflared, que está na rede edge.
  # Aqui o IP real vem de CF-Connecting-IP (definido pelo Cloudflare) e o esquema original é sempre https.
  map $http_cf_connecting_ip $cf_tunnel_ip { default $remote_addr; '~^[0-9a-fA-F:.]{3,45}$' $http_cf_connecting_ip; }
  server {
    listen 8081;
    set $cf_client_ip $cf_tunnel_ip;
    set $cf_proto https;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Grafana e qualquer outra rota administrativa NÃO existem aqui: o /grafana/ cai no frontend (404).
    include /etc/nginx/app-locations.inc;
  }
}
