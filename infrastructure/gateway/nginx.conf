worker_processes auto;
events { worker_connections 1024; }

http {
  server_tokens off;
  # upgrade de WebSocket (Grafana Live)
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  resolver 127.0.0.11 valid=10s ipv6=off;  # DNS interno do Docker (resolve upstreams sob demanda)

  server {
    listen 80;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Grafana (rede obs). Acesso só pelo loopback do host; login obrigatório (admin + GRAFANA_PASSWORD do .env).
    location = /grafana { return 301 /grafana/; }
    location /grafana/ {
      set $grafana http://grafana:3000;
      proxy_pass $grafana;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      error_page 502 503 504 = @unavailable;
    }

    # API (backend entra na Etapa 3). Upstream via variável: o gateway sobe mesmo sem o backend.
    location /api/ {
      set $backend http://backend:8080;
      proxy_pass $backend;
      proxy_set_header Host $http_host;   # mantém a porta (a checagem de Origin do front compara host:porta)
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;  # sobrescreve: o cliente não forja o próprio IP
      proxy_set_header X-Forwarded-Proto $scheme;
      error_page 502 503 504 = @unavailable;
    }

    # Frontend (entra na Etapa 5)
    location / {
      set $web http://web:3000;
      proxy_pass $web;
      proxy_set_header Host $http_host;   # mantém a porta (a checagem de Origin do front compara host:porta)
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;  # sobrescreve: o cliente não forja o próprio IP
      proxy_set_header X-Forwarded-Proto $scheme;
      error_page 502 503 504 = @unavailable;
    }

    location @unavailable {
      default_type text/plain;
      return 503 "ContaForte: servico indisponivel\n";
    }
  }
}
